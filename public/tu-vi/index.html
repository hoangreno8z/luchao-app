<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tử Vi — Lá Số Tử Vi Đẩu Số Đại Toàn | Dịch Sư Nguyễn Huy Hoàng</title>
    <meta name="description" content="Lập lá số Tử Vi Đẩu Số 12 cung, 14 chính tinh, ngũ hành phong thủy, tứ hóa, thần sát và đại vận — Dịch Sư Nguyễn Huy Hoàng">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=3.5.0">
</head>
<body>

    <!-- UNIVERSAL DROPDOWN HEADER -->
    <header class="app-universal-header">
        <div class="header-inner">
            <a href="/" class="brand-link">
                <span class="brand-icon">⭐</span>
                <span class="brand-title">NGUYỄN HUY HOÀNG</span>
                <span class="brand-sub">TỬ VI ĐẨU SỐ</span>
            </a>
            <div class="menu-dropdown-wrapper">
                <button type="button" class="menu-toggle-btn" id="menuToggleBtn">
                    <span>☰ MENU</span>
                    <span style="font-size: 0.75rem;">▼</span>
                </button>
                <div class="portal-dropdown-menu" id="portalDropdownMenu">
                    <a href="/" class="menu-item">
                        <span>🏠</span> Trang Chủ
                    </a>
                    <a href="/kinh-dich/" class="menu-item">
                        <span>☰</span> Kinh Dịch
                    </a>
                    <a href="/tu-vi/" class="menu-item active">
                        <span>⭐</span> Tử Vi
                    </a>
                    <a href="/thai-at/" class="menu-item">
                        <span>☯</span> Thái Ất
                    </a>
                    <a href="/bat-tu/" class="menu-item">
                        <span>🏛️</span> Bát Tự
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Page Title -->
        <div class="page-header">
            <div class="logo-badge">THẬP NHỊ CUNG VỊ — TINH HỆ ĐẨU SỐ</div>
            <h1 class="page-title">LÁ SỐ TỬ VI</h1>
            <p class="page-subtitle">Hệ thống an sao Tử Vi Đẩu Số chuẩn xác, phân định màu sắc Ngũ Hành phong thủy</p>
        </div>

        <!-- Input Form -->
        <div class="form-card">
            <form id="tuViForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inputName">Họ và Tên</label>
                        <input type="text" id="inputName" class="form-control" placeholder="Nhập họ tên..." required>
                    </div>

                    <div class="form-group">
                        <label for="inputGender">Giới Tính</label>
                        <select id="inputGender" class="form-control">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="inputSolarDay">Ngày Sinh (Dương Lịch)</label>
                        <input type="number" id="inputSolarDay" class="form-control" min="1" max="31" required>
                    </div>

                    <div class="form-group">
                        <label for="inputSolarMonth">Tháng Sinh (Dương Lịch)</label>
                        <input type="number" id="inputSolarMonth" class="form-control" min="1" max="12" required>
                    </div>

                    <div class="form-group">
                        <label for="inputSolarYear">Năm Sinh (Dương Lịch)</label>
                        <input type="number" id="inputSolarYear" class="form-control" min="1900" max="2100" required>
                    </div>

                    <div class="form-group">
                        <label for="inputHour">Giờ Sinh (Canh Giờ)</label>
                        <select id="inputHour" class="form-control">
                            <option value="0">Tý (23h - 01h)</option>
                            <option value="1">Sửu (01h - 03h)</option>
                            <option value="2">Dần (03h - 05h)</option>
                            <option value="3">Mão (05h - 07h)</option>
                            <option value="4">Thìn (07h - 09h)</option>
                            <option value="5">Tị (09h - 11h)</option>
                            <option value="6">Ngọ (11h - 13h)</option>
                            <option value="7">Mùi (13h - 15h)</option>
                            <option value="8">Thân (15h - 17h)</option>
                            <option value="9">Dậu (17h - 19h)</option>
                            <option value="10">Tuất (19h - 21h)</option>
                            <option value="11">Hợi (21h - 23h)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="inputViewYear">Năm Xem Hạn</label>
                        <input type="number" id="inputViewYear" class="form-control" min="1900" max="2100" value="2026">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>⚡ LẬP LÁ SỐ TỬ VI ĐẨU SỐ</span>
                </button>
            </form>
        </div>

        <!-- 12-Palace Traditional Chart -->
        <div class="chart-container-wrapper">
            <div class="chart-header-actions">
                <div class="chart-header-title">ĐỒ HÌNH THẬP NHỊ CUNG — LÁ SỐ TỬ VI</div>
                <button type="button" class="btn-export-png" id="btnExportPng">
                    <span>📥 Tải Ảnh Lá Số HD (PNG)</span>
                </button>
            </div>

            <!-- The Grid Element -->
            <div class="tuvi-grid" id="tuviGrid">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Tra Cứu Tinh Tú Section -->
        <div class="reference-card">
            <div class="ref-tabs">
                <button type="button" class="ref-tab-btn active" data-tab="chinh_tinh">14 Chính Tinh</button>
                <button type="button" class="ref-tab-btn" data-tab="luc_sat">Lục Sát & Hung Tinh</button>
                <button type="button" class="ref-tab-btn" data-tab="luc_cat">Lục Cát Tinh</button>
                <button type="button" class="ref-tab-btn" data-tab="tu_hoa">Bộ Tứ Hóa</button>
            </div>
            <div class="ref-content-grid" id="refContentGrid">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/lunar.js"></script>
    <script type="module" src="script.js?v=3.5.0"></script>
</body>
</html>
